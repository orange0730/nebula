name: 錯誤回報 Bug Report
description: 回報 Nebula 外掛(LiveTheme / Free Mode)的錯誤或當機
labels: [bug]
title: "[Bug] <title>"

body:
    - type: markdown
      attributes:
          value: |
              回報前請先確認:這是 Nebula 自己外掛(LiveTheme、Free Mode)的問題,而不是 Discord 本身
              或上游 Vencord 核心功能的問題。如果是 Vencord 核心/其他內建外掛的問題,請到
              [Vencord 官方 repo](https://github.com/Vendicated/Vencord/issues) 回報。

    - type: dropdown
      id: plugin
      attributes:
          label: 哪個外掛出問題?
          options:
              - LiveTheme
              - Free Mode(自由模式)
              - 兩個都有 / 不確定
      validations:
          required: true

    - type: textarea
      id: bug-description
      attributes:
          label: 發生什麼問題?
          description: 描述問題發生的情境、時機
          placeholder: 在...情況下,發生...,導致...無法正常運作
      validations:
          required: true

    - type: textarea
      id: steps-to-take
      attributes:
          label: 重現步驟
          placeholder: |
              1. 做...
              2. 接著...
              3. 觀察到「錯誤/當機」
      validations:
          required: true

    - type: textarea
      id: crash-log
      attributes:
          label: 錯誤訊息
          description: 按 `Ctrl+Shift+I` 打開開發者主控台,找到紅色錯誤訊息貼在下面(可略過網路錯誤)
          value: |
              ```
              在這裡貼上錯誤訊息
              ```
      validations:
          required: false

    - type: input
      id: discord-version
      attributes:
          label: Discord 版本
          placeholder: 例如 Stable 1.0.151
      validations:
          required: true

    - type: checkboxes
      id: agreement-check
      attributes:
          label: 確認事項
          options:
              - label: 我已經搜尋過現有 Issue,沒有重複回報
              - label: 這是 Nebula 自己外掛(LiveTheme/Free Mode)的問題,不是 Vencord 核心或其他內建外掛的問題
