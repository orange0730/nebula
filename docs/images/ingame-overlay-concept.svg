<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gamebg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="55%" stop-color="#0e2032"/>
      <stop offset="100%" stop-color="#132a1f"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3b2e"/>
      <stop offset="100%" stop-color="#0e2032"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14301f"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- "game" backdrop -->
  <rect x="0" y="0" width="800" height="480" rx="18" fill="url(#gamebg)"/>
  <circle cx="660" cy="90" r="46" fill="url(#moon)"/>
  <circle cx="660" cy="90" r="20" fill="#ffe9b8" fill-opacity="0.85"/>
  <path d="M0 300 Q120 240 260 300 T520 290 T800 310 V480 H0 Z" fill="url(#hillA)"/>
  <path d="M0 360 Q160 320 340 360 T700 350 T800 370 V480 H0 Z" fill="url(#hillB)"/>
  <g fill="#0a1420">
    <rect x="120" y="150" width="14" height="120" rx="3"/>
    <rect x="600" y="180" width="14" height="90" rx="3"/>
    <rect x="470" y="130" width="14" height="140" rx="3"/>
  </g>
  <text x="24" y="466" font-family="sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.35">Any borderless-windowed game or app underneath</text>

  <!-- game HUD hint -->
  <rect x="24" y="24" width="150" height="34" rx="8" fill="#000000" fill-opacity="0.35"/>
  <rect x="36" y="34" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="36" y="45" width="90" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>

  <!-- hotkey badge -->
  <g filter="url(#soft2)">
    <rect x="300" y="24" width="200" height="34" rx="17" fill="#12101f" fill-opacity="0.92" stroke="#8f7bff" stroke-opacity="0.4"/>
    <text x="400" y="46" text-anchor="middle" font-family="monospace" font-size="13" fill="#d9d4ff">Ctrl+Shift+`</text>
  </g>

  <!-- overlay: chat panel (top-right) -->
  <g filter="url(#soft2)">
    <rect x="560" y="90" width="216" height="300" rx="14" fill="#14112a" fill-opacity="0.88" stroke="#8f7bff" stroke-opacity="0.45"/>
    <text x="578" y="116" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1" fill="#c8aaff">NEBULA · CHAT</text>
    <text x="578" y="130" font-family="sans-serif" font-size="9" fill="#8f88b8"># party-planning</text>

    <g fill="#ffffff" fill-opacity="0.2">
      <circle cx="588" cy="156" r="8"/>
      <rect x="602" y="147" width="60" height="6" rx="3" fill-opacity="0.7"/>
      <rect x="602" y="157" width="140" height="6" rx="3"/>
      <circle cx="588" cy="182" r="8"/>
      <rect x="602" y="173" width="50" height="6" rx="3" fill-opacity="0.7"/>
      <rect x="602" y="183" width="110" height="6" rx="3"/>
      <rect x="602" y="193" width="90" height="6" rx="3"/>
      <circle cx="588" cy="218" r="8"/>
      <rect x="602" y="209" width="70" height="6" rx="3" fill-opacity="0.7"/>
      <rect x="602" y="219" width="150" height="6" rx="3"/>
      <circle cx="588" cy="244" r="8"/>
      <rect x="602" y="235" width="55" height="6" rx="3" fill-opacity="0.7"/>
      <rect x="602" y="245" width="120" height="6" rx="3"/>
    </g>

    <rect x="576" y="352" width="184" height="26" rx="8" fill="#000000" fill-opacity="0.35" stroke="#8f7bff" stroke-opacity="0.4"/>
    <text x="586" y="369" font-family="sans-serif" font-size="10" fill="#8f88b8">Type a message, Enter to send</text>
  </g>

  <!-- overlay: voice room widget (below chat) -->
  <g filter="url(#soft2)">
    <rect x="24" y="330" width="200" height="110" rx="14" fill="#14112a" fill-opacity="0.88" stroke="#8f7bff" stroke-opacity="0.45"/>
    <text x="40" y="354" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1" fill="#c8aaff">NEBULA · VOICE ROOM</text>
    <circle cx="52" cy="392" r="14" fill="none" stroke="#3ba55d" stroke-width="3"/>
    <circle cx="52" cy="392" r="9" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="72" y="386" width="60" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="52" cy="418" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
    <circle cx="52" cy="418" r="9" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="72" y="412" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <!-- inset: Free Mode window showing the pin action -->
  <g filter="url(#soft2)">
    <rect x="264" y="150" width="230" height="150" rx="14" fill="#0d0b18" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="264" y="150" width="230" height="30" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <text x="280" y="170" font-family="sans-serif" font-size="11" fill="#e4e0ff"># party-planning</text>
    <circle cx="446" cy="165" r="11" fill="#8f7bff" fill-opacity="0.9"/>
    <path d="M446 158 l3 5 6 1 -4.5 4.5 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4.5 6 -1 Z"
          transform="translate(0,0) scale(0.75) translate(150,55)" fill="#ffffff"/>
    <g fill="#ffffff" fill-opacity="0.15">
      <rect x="280" y="196" width="180" height="8" rx="4"/>
      <rect x="280" y="214" width="140" height="8" rx="4"/>
      <rect x="280" y="232" width="160" height="8" rx="4"/>
    </g>
    <text x="280" y="285" font-family="sans-serif" font-size="10" fill="#8f88b8">Free Mode window — click the pin</text>
  </g>

  <path d="M446 176 C 500 210, 520 260, 560 260" fill="none" stroke="#c8aaff" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M556 253 l8 7 -2 10" fill="none" stroke="#c8aaff" stroke-width="2" opacity="0.7"/>
</svg>
