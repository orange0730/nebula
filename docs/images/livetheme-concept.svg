  <circle cx="68" cy="17" r="6" fill="#ffffff" fill-opacity="0.25"/>

  <!-- guild rail -->
  <rect x="0" y="34" width="72" height="446" fill="#000000" fill-opacity="0.22"/>
  <circle cx="36" cy="70" r="20" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="36" cy="120" r="20" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="36" cy="170" r="20" fill="#ffffff" fill-opacity="0.14"/>
