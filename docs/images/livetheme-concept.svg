<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="45%" stop-color="#1a0033"/>
      <stop offset="75%" stop-color="#2d004d"/>
      <stop offset="100%" stop-color="#05010f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="18" fill="url(#bg)"/>
  <circle cx="620" cy="120" r="220" fill="url(#glow1)"/>
  <circle cx="150" cy="380" r="200" fill="url(#glow2)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="800" height="34" rx="18" fill="#000000" fill-opacity="0.25"/>
  <circle cx="24" cy="17" r="6" fill="#ffffff" fill-opacity="0.25"/>
