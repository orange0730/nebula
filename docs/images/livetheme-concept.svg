    <rect x="356" y="82" width="120" height="9" rx="4.5"/>
    <rect x="356" y="98" width="280" height="9" rx="4.5"/>

    <circle cx="330" cy="150" r="16"/>
    <rect x="356" y="142" width="90" height="9" rx="4.5"/>
    <rect x="356" y="158" width="220" height="9" rx="4.5"/>
